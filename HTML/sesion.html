<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Taller</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <header>
 
    <nav>
      <a href="../index.html">Talleres</a> &nbsp; &nbsp;
    </nav>
    
  </header>
  <main>
    <section>
 
        <form class="formulario-registro" id="form-registro" novalidate>
        <h1>Iniciar sesion</h1>
 
        <label for="correo">Correo: </label>
        <input type="email" name="email" required>
        <span class="error" id="error-email" ></span>
        <br><br>
        <label for="contrasena">Contrasena: </label>
        <input type="contrasena" id="contrasena" name="contrasena" required>
        <span class="error" id="error-contrasena"></span>
        <button type="submit">Iniciar sesión</button>
 
    </form>
    </section>
 
  </main>
 
</body>
</html>
